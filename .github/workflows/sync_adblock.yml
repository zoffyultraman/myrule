name: Sync AdBlock Rules

on:
  schedule:
    - cron: "0 3 * * *"   # 每天凌晨3点（UTC）
  workflow_dispatch:       # 允许手动运行
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and convert AdBlock list
        run: |
          curl -sSL https://testingcf.jsdelivr.net/gh/GeQ1an/Rules@master/QuantumultX/Filter/AdBlock.list \
            | sed 's/HOST-SUFFIX/DOMAIN-SUFFIX/g' > AdBlock.list

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AdBlock
          git commit -m "Sync AdBlock list $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
