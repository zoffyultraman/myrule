name: Sync AdBlock Rules

on:
  schedule:
    - cron: "0 3 * * *"   # 每天凌晨3点 UTC（北京时间11点）
  workflow_dispatch:

permissions:
  contents: write   # 允许推送

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and convert AdBlock list
        run: |
          set -e
          curl -sSL https://testingcf.jsdelivr.net/gh/GeQ1an/Rules@master/QuantumultX/Filter/AdBlock.list \
            | sed 's/HOST-SUFFIX/DOMAIN-SUFFIX/g' \
            | sed 's/host-suffix/DOMAIN-SUFFIX/g' \
            | grep -v '^[[:space:]]*$' \
            | grep -v '^#' > AdBlock.list
          ls -l AdBlock.list

      - name: Always commit first version if missing
        id: check_file
        run: |
          if [ ! -f AdBlock.list ]; then
            echo "File not generated!"
            exit 1
          fi
          if git ls-files --error-unmatch AdBlock.list > /dev/null 2>&1; then
            if git diff --quiet AdBlock.list; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT  # 文件首次生成
          fi

      - name: Commit and push changes
        if: steps.check_file.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AdBlock.list
          git commit -m "Sync AdBlock.list $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
